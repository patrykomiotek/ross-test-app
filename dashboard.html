<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rossmann - Produkty</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="dashboard-container-h4j7" data-testid="dashboard-page">
    <!-- Greeting -->
    <div class="dashboard-greeting-p2t5" data-testid="greeting-section">
      <h1 class="greeting-title-k9m3" id="greeting-title">Witaj!</h1>
      <p class="greeting-date-w5r8" id="greeting-date"></p>
    </div>

    <!-- Recommended Section -->
    <section class="recommended-section-n6v2" data-testid="recommended-section">
      <h2 class="section-title-d4f8">&#9733; Polecane dla Ciebie</h2>
      <div class="recommended-grid-k3p7" id="recommended-grid">
        <div class="loading-spinner-k4m2"><div class="spinner-icon-r8t3"></div> Ładowanie...</div>
      </div>
    </section>

    <!-- Main content -->
    <div class="dashboard-main-t8k2">
      <!-- Sidebar filters -->
      <aside class="sidebar-filters-v3n8" data-testid="filter-sidebar">
        <h3 class="sidebar-title-m7k2">Kategorie</h3>
        <div id="category-filters">
          <!-- Generated by JS -->
        </div>
      </aside>

      <!-- Product listing -->
      <div>
        <div class="controls-bar-j5t9">
          <div class="search-input-container-p2k8">
            <svg class="search-icon-t3v9" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input
              type="text"
              class="search-input-r7m4"
              data-testid="search-input"
              placeholder="Szukaj produktów..."
              id="search-input"
              oninput="handleSearch()"
            >
          </div>
          <select class="sort-select-w8k3" id="sort-select" data-testid="sort-select" onchange="handleSort()">
            <option value="default">Sortuj wg</option>
            <option value="price-asc">Cena rosnąco</option>
            <option value="price-desc">Cena malejąco</option>
            <option value="name-asc">Nazwa A-Z</option>
          </select>
        </div>

        <div class="products-grid-w2n5" id="products-grid" data-testid="products-grid">
          <div class="loading-spinner-k4m2"><div class="spinner-icon-r8t3"></div> Ładowanie produktów...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    var currentUser = requireAuth();
    if (!currentUser) throw new Error("Not authenticated");

    // Set greeting
    document.getElementById("greeting-title").textContent = "Witaj, " + currentUser.name + "!";
    document.getElementById("greeting-date").textContent = getCurrentDateFormatted();

    // Render navbar
    document.getElementById("navbar-placeholder").innerHTML = renderNavbar("dashboard");

    // State
    var allProducts = getProducts();
    var activeCategories = [];
    var searchQuery = "";
    var sortMode = "default";

    // Categories config
    var categories = [
      { key: "Pielegnacja", label: "Pielęgnacja" },
      { key: "Higiena", label: "Higiena" },
      { key: "Makijaz", label: "Makijaż" },
      { key: "Zdrowie", label: "Zdrowie" }
    ];

    // Render category filters
    function renderCategoryFilters() {
      var html = "";
      categories.forEach(function(cat) {
        var count = allProducts.filter(function(p) { return p.category === cat.key; }).length;
        html += '' +
          '<div class="filter-category-group">' +
            '<label class="filter-checkbox-label">' +
              '<input type="checkbox" value="' + cat.key + '" onchange="handleCategoryFilter()" data-testid="filter-' + cat.key.toLowerCase() + '">' +
              '<span>' + cat.label + '</span>' +
              '<span class="filter-count-badge">' + count + '</span>' +
            '</label>' +
          '</div>';
      });
      document.getElementById("category-filters").innerHTML = html;
    }

    // Filter and sort products
    function getFilteredProducts() {
      var products = allProducts;

      // Category filter
      if (activeCategories.length > 0) {
        products = products.filter(function(p) {
          return activeCategories.indexOf(p.category) !== -1;
        });
      }

      // Search filter
      if (searchQuery) {
        var q = searchQuery.toLowerCase();
        products = products.filter(function(p) {
          return p.name.toLowerCase().indexOf(q) !== -1 ||
                 p.description.toLowerCase().indexOf(q) !== -1;
        });
      }

      // Sort
      products = products.slice(); // copy
      if (sortMode === "price-asc") {
        products.sort(function(a, b) { return a.price - b.price; });
      } else if (sortMode === "price-desc") {
        products.sort(function(a, b) { return b.price - a.price; });
      } else if (sortMode === "name-asc") {
        products.sort(function(a, b) { return a.name.localeCompare(b.name, "pl"); });
      }

      return products;
    }

    function renderProducts() {
      var products = getFilteredProducts();
      var grid = document.getElementById("products-grid");

      if (products.length === 0) {
        grid.innerHTML = '' +
          '<div class="no-results-message-t5k8" data-testid="no-results">' +
            '<h3>Brak wyników</h3>' +
            '<p>Nie znaleziono produktów spełniających kryteria wyszukiwania.</p>' +
          '</div>';
        return;
      }

      var html = "";
      products.forEach(function(product) {
        html += renderProductCard(product);
      });
      grid.innerHTML = html;
    }

    function renderRecommended() {
      var recommended = getRecommendedProducts(4);
      var html = "";
      recommended.forEach(function(product) {
        html += renderProductCard(product);
      });
      document.getElementById("recommended-grid").innerHTML = html;
    }

    // Event handlers
    function handleSearch() {
      searchQuery = document.getElementById("search-input").value.trim();
      renderProducts();
    }

    function handleSort() {
      sortMode = document.getElementById("sort-select").value;
      renderProducts();
    }

    function handleCategoryFilter() {
      var checkboxes = document.querySelectorAll('#category-filters input[type="checkbox"]');
      activeCategories = [];
      checkboxes.forEach(function(cb) {
        if (cb.checked) activeCategories.push(cb.value);
      });
      renderProducts();
    }

    // Initial render with simulated loading delay
    renderCategoryFilters();

    setTimeout(function() {
      renderRecommended();
    }, 500);

    setTimeout(function() {
      renderProducts();
    }, 1000);
  </script>
</body>
</html>

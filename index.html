<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rossmann - Logowanie</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-page-container">
    <div class="login-card-r4t8" data-testid="login-card">
      <div class="login-logo-section">
        <div class="login-logo-icon">R</div>
        <h1 class="login-title-k5m2">Zaloguj się</h1>
        <p class="login-subtitle-v8n1">Witaj w sklepie Rossmann</p>
      </div>

      <div id="login-error" class="login-error-message" data-testid="login-error">
        <span>&#9888;</span>
        <span id="login-error-text">Nieprawidłowy email lub hasło</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Adres email</label>
          <input
            type="email"
            id="email"
            class="input-field-a3m9"
            placeholder="np. test@rossmann.pl"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Hasło</label>
          <input
            type="password"
            class="input-field-a3m9"
            data-testid="password-input"
            placeholder="Wprowadź hasło"
            required
            autocomplete="current-password"
            id="password"
          >
        </div>

        <div class="checkbox-group-t7r3">
          <label class="checkbox-label-w2p5">
            <input type="checkbox" id="rememberMe" data-testid="remember-checkbox">
            <span>Zapamiętaj mnie</span>
          </label>
          <a href="#" class="forgot-link-j8k4" onclick="event.preventDefault();" data-testid="forgot-password-link">Nie pamiętam hasła</a>
        </div>

        <div class="login-btn-container">
          <button type="submit" class="btn-primary-x7k2" data-testid="login-button">Zaloguj się</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Check if already logged in
    (function() {
      var user = getLoggedInUser();
      if (user) {
        window.location.href = "dashboard.html";
        return;
      }

      // Pre-fill remembered email
      var remembered = localStorage.getItem("rossmann_remember");
      if (remembered) {
        document.getElementById("email").value = remembered;
        document.getElementById("rememberMe").checked = true;
      }
    })();

    function handleLogin(e) {
      e.preventDefault();
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var errorDiv = document.getElementById("login-error");
      var errorText = document.getElementById("login-error-text");
      var submitBtn = e.target.querySelector('button[type="submit"]');

      // Clear previous errors
      errorDiv.classList.remove("visible");
      emailInput.classList.remove("input-error");
      passwordInput.classList.remove("input-error");

      var email = emailInput.value.trim();
      var password = passwordInput.value;
      var remember = document.getElementById("rememberMe").checked;

      // Simulate loading delay
      submitBtn.disabled = true;
      submitBtn.textContent = "Logowanie...";

      setTimeout(function() {
        var result = login(email, password, remember);
        if (result.success) {
          window.location.href = "dashboard.html";
        } else {
          errorText.textContent = result.message;
          errorDiv.classList.add("visible");
          emailInput.classList.add("input-error");
          passwordInput.classList.add("input-error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Zaloguj się";
        }
      }, 800);
    }
  </script>
</body>
</html>
